name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 1. Spin up a temporary PostgreSQL database for the tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Tests
      env:
        # 2. Inject the URL to the temporary GitHub Postgres database
        DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
        SECRET_KEY: "test_secret_key"
        GEMINI_API_KEY: "dummy_key"
      run: |
        cd backend
        python -m pytest