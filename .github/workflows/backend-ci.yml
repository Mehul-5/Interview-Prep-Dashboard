name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # Updated to match your local version
        cache: 'pip' # This enables automatic dependency caching
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Tests
      env:
        DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
        # CHANGE: Use a key at least 32 characters long to fix the security warning
        SECRET_KEY: "super_secret_test_key_that_is_long_enough_for_jwt"
        GEMINI_API_KEY: "dummy_key"
      run: |
        cd backend
        python -m pytest